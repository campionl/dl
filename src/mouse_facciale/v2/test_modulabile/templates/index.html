<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Head Mouse Controller</title>
    <style>
        /* Stili CSS per l'interfaccia grafica */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            border-bottom: 2px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            text-align: center;
            color: #58a6ff;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .video-panel {
            flex: 2;
            min-width: 400px;
        }

        .controls-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel h2 {
            color: #58a6ff;
            font-size: 1.5em;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .video-feed img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            background-color: #0d1117;
            display: block;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #c9d1d9;
            font-weight: bold;
        }

        .control-group .button-group,
        .control-group .slider-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2ea043;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background-color: #30363d;
        }

        button.secondary:hover {
            background-color: #444c56;
        }

        input[type="range"] {
            flex-grow: 1;
            width: auto;
            -webkit-appearance: none;
            height: 8px;
            background: #30363d;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #58a6ff;
            cursor: pointer;
            border: 2px solid #c9d1d9;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #58a6ff;
            cursor: pointer;
            border: 2px solid #c9d1d9;
        }

        .status-info p {
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .status-info span {
            font-weight: bold;
            color: #79c0ff;
        }

        .status-info .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 5px;
        }

        .status-info .tag.paused {
            background-color: #dbab09; /* Yellow */
            color: #1c1c1c;
        }

        .status-info .tag.active {
            background-color: #2ea043; /* Green */
            color: white;
        }

        .status-info .tag.calibrating {
            background-color: #8957e5; /* Purple */
            color: white;
        }

        .status-info .tag.calibrated {
            background-color: #2ea043; /* Green */
            color: white;
        }

        .status-info .tag.pointer-mode {
            background-color: #58a6ff; /* Blue */
            color: white;
        }

        .status-info .tag.scroll-mode {
            background-color: #f7a057; /* Orange */
            color: #1c1c1c;
        }
        #videoStatus {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>🧠 Head Mouse Controller</h1>
    </header>

    <div class="container">
        <div class="panel video-panel">
            <h2>Video Feed & Status</h2>
            <div class="video-feed">
                <img id="videoStream" src="/video_feed" alt="Webcam Feed">
            </div>
            <p id="videoStatus"></p>
            <div class="status-info">
                <p>Stato Attuale: <span id="statusPaused"></span></p>
                <p>Modalità: <span id="statusMode"></span></p>
                <p>Calibrazione: <span id="statusCalibration"></span> (<span id="statusCalibrationProgress">0%</span>)</p>
                <p>Sensibilità Puntatore: <span id="statusSensitivity">6.0</span></p>
                <p>Sensibilità Scrolling: <span id="statusScrollSensitivity">3.0</span></p>
                <p>Rilevamento Faccia: <span id="statusFaceDetection"></span></p>
            </div>
        </div>

        <div class="panel controls-panel">
            <h2>Controlli</h2>

            <div class="control-group">
                <label>Stato del Sistema</label>
                <div class="button-group">
                    <button id="togglePauseBtn">Pausa / Riprendi</button>
                    <button id="resetCalibrationBtn" class="secondary">Reset Calibrazione</button>
                </div>
            </div>

            <div class="control-group">
                <label>Controllo Mouse</label>
                <div class="button-group">
                    <button id="resetMousePosBtn" class="secondary">Reset Posizione Mouse</button>
                    <button id="setPointerModeBtn" class="secondary">Modalità Puntatore</button>
                    <button id="setScrollModeBtn" class="secondary">Modalità Scroll</button>
                </div>
            </div>

            <div class="control-group">
                <label>Sensibilità Puntatore</label>
                <div class="slider-group">
                    <button class="adjust-sensitivity secondary" data-type="pointer" data-amount="-0.2">-</button>
                    <input type="range" id="pointerSensitivitySlider" min="0.5" max="12.0" step="0.1" value="6.0">
                    <button class="adjust-sensitivity secondary" data-type="pointer" data-amount="0.2">+</button>
                </div>
            </div>

            <div class="control-group">
                <label>Sensibilità Scrolling</label>
                <div class="slider-group">
                    <button class="adjust-sensitivity secondary" data-type="scroll" data-amount="-0.5">-</button>
                    <input type="range" id="scrollSensitivitySlider" min="1.0" max="20.0" step="0.5" value="3.0">
                    <button class="adjust-sensitivity secondary" data-type="scroll" data-amount="0.5">+</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Funzione per inviare richieste al backend Flask
        async function sendCommand(endpoint, method = 'GET') {
            try {
                const response = await fetch(endpoint, { method: method });
                const data = await response.json();
                console.log(`Command '${endpoint}' response:`, data);
                updateStatus(); // Aggiorna lo stato dopo ogni comando
                return data;
            } catch (error) {
                console.error(`Error sending command to ${endpoint}:`, error);
            }
        }

        // Event Listeners per i bottoni
        document.getElementById('togglePauseBtn').addEventListener('click', () => {
            sendCommand('/toggle_pause');
        });

        document.getElementById('resetCalibrationBtn').addEventListener('click', () => {
            sendCommand('/reset_calibration');
        });

        document.getElementById('resetMousePosBtn').addEventListener('click', () => {
            sendCommand('/reset_mouse_position');
        });

        document.getElementById('setPointerModeBtn').addEventListener('click', () => {
            sendCommand('/set_mode/pointer');
        });

        document.getElementById('setScrollModeBtn').addEventListener('click', () => {
            sendCommand('/set_mode/scroll');
        });

        // Event Listeners per i bottoni +/- della sensibilità
        document.querySelectorAll('.adjust-sensitivity').forEach(button => {
            button.addEventListener('click', (event) => {
                const type = event.target.dataset.type;
                const amount = parseFloat(event.target.dataset.amount);
                sendCommand(`/adjust_sensitivity/${type}/${amount}`);
            });
        });

        // Event Listeners per gli slider della sensibilità
        // Nota: i slider non inviano comandi direttamente all'input
        // I bottoni +/- sono i metodi raccomandati per regolare la sensibilità
        // Se si vuole usare il slider per settare un valore assoluto,
        // servirebbe un endpoint API dedicato nel backend.

        // Funzione per aggiornare lo stato mostrato nella GUI
        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();

                // Aggiorna lo stato di pausa
                const pausedSpan = document.getElementById('statusPaused');
                pausedSpan.textContent = data.paused ? 'PAUSATO' : 'ATTIVO';
                pausedSpan.className = 'tag ' + (data.paused ? 'paused' : 'active');

                // Aggiorna la modalità
                const modeSpan = document.getElementById('statusMode');
                modeSpan.textContent = data.current_mode.toUpperCase();
                modeSpan.className = 'tag ' + (data.current_mode === 'pointer' ? 'pointer-mode' : 'scroll-mode');

                // Aggiorna lo stato di calibrazione
                const calibrationSpan = document.getElementById('statusCalibration');
                const calibrationProgressSpan = document.getElementById('statusCalibrationProgress');
                if (data.calibration_done) {
                    calibrationSpan.textContent = 'CALIBRATO';
                    calibrationSpan.className = 'tag calibrated';
                    calibrationProgressSpan.textContent = '100%';
                } else {
                    calibrationSpan.textContent = 'IN CALIBRAZIONE';
                    calibrationSpan.className = 'tag calibrating';
                    calibrationProgressSpan.textContent = `${data.calibration_progress || 0}%`;
                }

                // Aggiorna stato rilevamento faccia
                const faceDetectionSpan = document.getElementById('statusFaceDetection');
                faceDetectionSpan.textContent = data.face_detected ? 'RILEVATA' : 'NON RILEVATA';
                faceDetectionSpan.style.color = data.face_detected ? 'lightgreen' : 'red';


                // Aggiorna sensibilità
                document.getElementById('statusSensitivity').textContent = data.sensitivity.toFixed(1);
                document.getElementById('pointerSensitivitySlider').value = data.sensitivity.toFixed(1); // Update slider position
                
                document.getElementById('statusScrollSensitivity').textContent = data.scroll_sensitivity.toFixed(1);
                document.getElementById('scrollSensitivitySlider').value = data.scroll_sensitivity.toFixed(1); // Update slider position

                // Update video stream status
                const videoStream = document.getElementById('videoStream');
                const videoStatus = document.getElementById('videoStatus');
                videoStream.onerror = function() {
                    videoStatus.textContent = '❌ Stream Offline';
                    videoStatus.style.color = 'red';
                };
                videoStream.onload = function() {
                    videoStatus.textContent = '✅ Stream Online';
                    videoStatus.style.color = 'green';
                };
                // Initial check for video stream status
                if (!videoStream.complete || videoStream.naturalWidth === 0) {
                     videoStatus.textContent = '🔄 Loading Stream...';
                     videoStatus.style.color = '#c9d1d9';
                }
            } catch (error) { // This catch block handles errors from fetch or parsing JSON
                console.error('Error fetching status:', error);
                document.getElementById('videoStatus').textContent = '❌ Errore Caricamento Stato';
                document.getElementById('videoStatus').style.color = 'red';
            }
        }

        // Fetch status initially and every few seconds
        updateStatus();
        setInterval(updateStatus, 1000); // Poll every 1 second
    </script>
</body>
</html>
